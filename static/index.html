<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Avatar Chat</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap');

        :root {
            /* Light Theme Variables */
            --glass-bg: rgba(255, 255, 255, 0.65);
            --glass-border: rgba(255, 255, 255, 0.8);
            --glass-shadow: 0 8px 32px 0 rgba(100, 100, 135, 0.15);
            --primary-accent: #6C5DD3;
            /* Keep the nice purple */
            --text-color: #2D3436;
            /* Darker grey for text */
            --bg-gradient: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg-gradient);
            color: var(--text-color);
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .container {
            width: 90%;
            height: 90%;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            box-shadow: var(--glass-shadow);
            display: flex;
            overflow: hidden;
            position: relative;
        }

        /* Access Screen */
        #access-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(245, 247, 250, 0.95);
            /* Light background */
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.5s ease;
        }

        #access-screen.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .input-group {
            margin-top: 20px;
            text-align: center;
        }

        input[type="text"] {
            padding: 12px 20px;
            border-radius: 12px;
            border: 1px solid rgba(0, 0, 0, 0.1);
            background: rgba(255, 255, 255, 0.8);
            color: var(--text-color);
            font-size: 1rem;
            width: 300px;
            outline: none;
            transition: all 0.3s ease;
        }

        input[type="text"]:focus {
            border-color: var(--primary-accent);
            box-shadow: 0 0 10px rgba(108, 93, 211, 0.2);
        }

        button.btn {
            background: var(--primary-accent);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            margin-left: 10px;
            transition: transform 0.2s;
        }

        button.btn:hover {
            transform: scale(1.05);
        }

        /* Split Layout */
        .split-layout {
            display: flex;
            width: 100%;
            height: 100%;
        }

        .avatar-section {
            flex: 1;
            position: relative;
            min-width: 0;
            /* The stage: a dark set the WebGL scene paints over */
            background: radial-gradient(circle at 50% 35%, #2a3040 0%, #141821 55%, #07080b 100%);
        }

        #avatar-canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .chat-section {
            flex: 0 0 400px;
            background: rgba(255, 255, 255, 0.4);
            /* Light semi-transparent */
            border-left: 1px solid var(--glass-border);
            display: flex;
            flex-direction: column;
            padding: 20px;
        }

        .chat-history {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            padding-right: 10px;
        }

        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 16px;
            font-size: 0.95rem;
            line-height: 1.4;
            animation: fadeIn 0.3s ease;
        }

        .message.user {
            align-self: flex-end;
            background: var(--primary-accent);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message.ai {
            align-self: flex-start;
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid rgba(0, 0, 0, 0.05);
            color: var(--text-color);
            border-bottom-left-radius: 4px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
        }

        .input-area {
            margin-top: 20px;
            display: flex;
            gap: 10px;
        }

        .input-area input {
            flex: 1;
            width: auto;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(0, 0, 0, 0.1);
            border-radius: 3px;
        }
    </style>
    <!-- Import Three.js and GLTFLoader -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>

<body>

    <div class="container">
        <!-- Validation Screen -->
        <div id="access-screen">
            <h1>Welcome Back</h1>
            <p style="opacity: 0.7;">Enter your API Key to initialize the Avatar System</p>
            <div class="input-group">
                <input type="text" id="api-key-input" placeholder="sk-..." />
                <button class="btn" type="button" onclick="validateKey(event)">Connect</button>
            </div>
            <p id="error-msg" style="color: #ff6b6b; margin-top: 10px; min-height: 20px;"></p>
        </div>

        <!-- Main Content -->
        <div class="split-layout">
            <div class="avatar-section">
                <canvas id="avatar-canvas"></canvas>
            </div>
            <div class="chat-section">
                <div class="chat-history" id="chat-history">
                    <!-- Messages will appear here -->
                    <div class="message ai">Hello! I am ready to chat.</div>
                </div>
                <div class="input-area">
                    <input type="text" id="user-input" placeholder="Type a message..." onkeypress="handleEnter(event)"
                        disabled />
                    <button class="btn" id="send-btn" onclick="sendMessage()" disabled>→</button>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="/static/js/main.js"></script>
</body>

</html>
